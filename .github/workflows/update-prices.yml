name: Mise à jour des prix

on:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi vers 5 h (heure de Paris)
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/build_db.py
      - name: Enregistrer la nouvelle base
        run: |
          git config user.name "coteo-bot"
          git config user.email "coteo-bot@users.noreply.github.com"
          git add data/db.json
          git diff --cached --quiet || git commit -m "Prix Cardmarket du $(date +%F)"
          git push
